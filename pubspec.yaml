name: compass_3d
description: "High-precision No-GPS 3D Indoor Compass and Multi-Floor Navigation for Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Official Flutter Community sensor plugins
  sensors_plus: ^6.1.1

  # Official Flutter camera plugin for live AR canvassing
  camera: ^0.11.1

  # Google Premier Partner location and permission plugins
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Google / Dart Team official 3D matrix math and collections
  vector_math: ^2.1.4
  collection: ^1.19.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_maps/
