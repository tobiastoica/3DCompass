name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android Platform Files
        run: |
          rm -rf android/
          flutter create --platforms=android --org com.compass3d.indoor .
          python3 scripts/configure_android.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: dart test/run_all_tests.dart

      - name: Build Android APK
        run: |
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Print Failure Log
        if: failure()
        run: |
          echo "=== FAILURE LOG SUMMARY ==="
          grep -i -C 3 -E "error:|exception:|failed" build.log | tail -n 100 || true
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -n 100 build.log || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-compass-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
