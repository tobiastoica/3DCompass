name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android Platform Files
        run: |
          rm -rf android/
          flutter create --platforms=android --org com.compass3d.indoor .
          rm -f test/widget_test.dart
          python3 scripts/configure_android.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: dart test/run_all_tests.dart

      - name: Build Android APK
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} --build-name=1.0.${{ github.run_number }} -v 2>&1 | tee build.log

      - name: Prepare Failure Diagnostics
        if: failure()
        run: |
          python3 -c "
          with open('build.log', 'r', errors='ignore') as f:
              lines = f.readlines()

          matches = []
          for i, line in enumerate(lines):
              l_lower = line.lower()
              if 'failed to build' in l_lower or 'target ' in l_lower and 'failed' in l_lower or 'caused by:' in l_lower or 'error:' in l_lower:
                  start = max(0, i - 12)
                  end = min(len(lines), i + 15)
                  matches.append(f'=== MATCH AT LINE {i} ===\n')
                  matches.extend(lines[start:end])
                  matches.append('\n----------------------------------------\n')

          if not matches:
              matches = lines[-120:]

          with open('failure_diagnostics.txt', 'w') as out:
              out.writelines(matches[-150:])
          "

      - name: Report Build Failure to Release
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Build Failure Diagnostics"
          body_path: failure_diagnostics.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate and Stage APK
        run: |
          echo "=== SEARCHING WORKSPACE FOR COMPILED APK FILES ==="
          find . -type f -name "*.apk" -ls
          mkdir -p apk_output
          find . -type f -name "*.apk" ! -path "*/apk_output/*" -exec cp -v {} apk_output/ \;
          echo "=== STAGED APK FILES ==="
          ls -la apk_output/
          if [ -z "$(ls -A apk_output)" ]; then
            echo "ERROR: No APK files found in workspace!"
            exit 1
          fi
          echo "## ✅ APK Successfully Built and Staged" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh apk_output/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-compass-release-apk
          path: apk_output/*.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "3D Compass Android Release v1.0.0"
          body: |
            ### 🧭 3D Compass & Multi-Floor Navigation - APK Release
            - **Commit**: `${{ github.sha }}`
            - **Target OS**: Android (minSdk 24, compileSdk 34)
            - **Features**: Doorway calibration, Barometric altimetry, 7-state EKF sensor fusion, 3D Compass HUD, 3D A* Multi-Floor routing, offline binary `.3dnav` engine.
            - **Telemetry Log**: `/storage/emulated/0/Download/3d_compass_log_<timestamp>.txt`
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
