name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerate Android Platform Files
        run: |
          rm -rf android/
          flutter create --platforms=android --org com.compass3d.indoor .
          python3 scripts/configure_android.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: dart test/run_all_tests.dart

      - name: Build Android APK
        run: |
          flutter build apk --release -v 2>&1 | tee build.log

      - name: Locate and Stage APK
        run: |
          echo "=== SEARCHING WORKSPACE FOR COMPILED APK FILES ==="
          find . -type f -name "*.apk" -ls
          mkdir -p apk_output
          find . -type f -name "*.apk" ! -path "*/apk_output/*" -exec cp -v {} apk_output/ \;
          echo "=== STAGED APK FILES ==="
          ls -la apk_output/
          if [ -z "$(ls -A apk_output)" ]; then
            echo "ERROR: No APK files found in workspace!"
            exit 1
          fi

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-compass-release-apk
          path: apk_output/*.apk

      - name: Publish Direct APK Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "3D Compass Android Release v1.0.0"
          body: |
            ### 🧭 3D Compass & Multi-Floor Navigation - APK Release
            - **Commit**: `${{ github.sha }}`
            - **Target OS**: Android (minSdk 24, compileSdk 34)
            - **Features**: Doorway calibration, Barometric altimetry, 7-state EKF sensor fusion, 3D Compass HUD, 3D A* Multi-Floor routing, offline binary `.3dnav` engine.
            - **Telemetry Log**: `/storage/emulated/0/Download/3d_compass_log_<timestamp>.txt`
          files: apk_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
