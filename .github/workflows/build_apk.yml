name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Clean Android Scaffolding
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.compass3d.indoor

          # Inject permissions into AndroidManifest.xml
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              content = f.read()

          permissions = '''
              <uses-permission android:name=\"android.permission.HIGH_SAMPLING_RATE_SENSORS\" />
              <uses-permission android:name=\"android.permission.ACTIVITY_RECOGNITION\" />
              <uses-permission android:name=\"android.permission.BODY_SENSORS\" />
              <uses-permission android:name=\"android.permission.ACCESS_FINE_LOCATION\" />
              <uses-permission android:name=\"android.permission.ACCESS_COARSE_LOCATION\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"28\" />
          '''

          content = content.replace('<application', permissions + '\n    <application android:requestLegacyExternalStorage=\"true\"')
          content = content.replace('</activity>', '</activity>\n        <meta-data android:name=\"com.google.ar.core\" android:value=\"optional\" />')

          with open(manifest_path, 'w') as f:
              f.write(content)
          print('Successfully configured AndroidManifest.xml')
          "

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Test Suite
        run: dart test/run_all_tests.dart

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-compass-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
